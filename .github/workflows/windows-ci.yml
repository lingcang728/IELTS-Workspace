name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Full verify gate
        shell: pwsh
        run: .\verify.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Validate tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -cne "v$version") { throw "Tag and version differ: ${{ github.ref_name }} / $version" }
      - name: Build signed release assets
        run: npm run package:release
      - name: Publish release when absent
        shell: pwsh
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $exists) {
            $assets = Get-ChildItem -LiteralPath output/release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -eq 'latest.json' } | Select-Object -ExpandProperty FullName
            gh release create '${{ github.ref_name }}' --verify-tag --title "IELTS Workspace ${{ github.ref_name }}" --generate-notes @assets
          }
