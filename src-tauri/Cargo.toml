[package]
name = "ielts-workspace"
version = "1.0.0"
description = "Local portable IELTS Academic computer-test workspace"
authors = ["Linc"]
edition = "2021"

[lib]
name = "ielts_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
